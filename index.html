        /* Scalable content container */

        }

        .scalable-heading {
            font-size: calc(1.65rem * var(--content-scale));
            line-height: 1.35;
        }

        /* Inline fill-in-the-blank inputs */
        .blank-input {
            display: inline-block;
            min-width: 150px;
            max-width: 100%;
            padding: 4px 12px;
            margin: 3px 4px;
            border: 2.5px solid #94a3b8;
            border-radius: 12px;
            background-color: #ffffff;
            color: #0f172a;
            font-weight: 700;
            font-size: inherit;
            text-align: center;
            transition: all 0.2s ease;
            outline: none;
            vertical-align: baseline;
        }

            border-color: #16a34a;
            box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.2);
            background-color: #f0fdf4;
        }

        .blank-input.active-target {
            border-color: #0284c7;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.2);
        }

        .blank-input.correct {
            border-color: #16a34a !important;
            background-color: #dcfce7 !important;
            color: #14532d !important;
        }

        .blank-input.incorrect {
            border-color: #dc2626 !important;
            background-color: #fee2e2 !important;
            color: #991b1b !important;
        }

        /* Table inputs & Textareas */
        .table-input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            background-color: #ffffff;
            font-size: inherit;
            font-weight: 500;
            color: #0f172a;
            transition: all 0.2s ease;
            outline: none;

            border-color: #16a34a;

        }

        .table-input.correct {
            border-color: #16a34a;
            background-color: #f0fdf4;
        }

            border-color: #ef4444;
            background-color: #fef2f2;

        .word-chip {
            cursor: pointer;
            user-select: none;
            transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);

        .word-chip:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px -3px rgba(22, 163, 74, 0.25);

        .word-chip:active {
            transform: scale(0.96);

            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 8px;
        }

            background: #94a3b8;
            border-radius: 8px;
        }

        }

            to { opacity: 1; transform: translateY(0); }
        }
        .step-animate {
            animation: fadeSlideIn 0.3s ease-out forwards;
        }

            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }

    <script>
        /* =====================================================================
           1. AUDIO FEEDBACK (Web Audio API - No external files required)
           ===================================================================== */
        let soundEnabled = true;
        let audioCtx = null;

        function playTone(type) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(680, now + 0.06);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
                    osc.start(now);
                    osc.stop(now + 0.07);
                } else if (type === 'success') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                    gain.gain.setValueAtTime(0.14, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(240, now);
                    osc.frequency.linearRampToValueAtTime(180, now + 0.18);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }
            } catch (e) {
                // Ignore audio errors if blocked by browser policy
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('icon-sound-on').classList.toggle('hidden', !soundEnabled);
            document.getElementById('icon-sound-off').classList.toggle('hidden', soundEnabled);
            showToast(soundEnabled ? 'Đã bật âm thanh' : 'Đã tắt âm thanh', 'info');
        }

        /* =====================================================================
           4. HELPER FUNCTIONS

        function normalizeText(str) {
            return (str || '')
                .toLowerCase()
                .replace(/hoá/g, 'hóa')
                .replace(/co2|co₂/g, 'carbon dioxide')
                .replace(/o2|o₂/g, 'oxygen')
                .replace(/h2o|h₂o/g, 'nước')
                .replace(/[.,;!?()]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function isExactMatch(userVal, validList) {
            const norm = normalizeText(userVal);
            if (!norm) return false;
            return validList.some(v => normalizeText(v) === norm || norm.includes(normalizeText(v)));
        }

        function isKeywordMatch(userVal, keywords) {
            const norm = normalizeText(userVal);
            if (!norm) return false;
            return keywords.some(k => norm.includes(normalizeText(k)));
        }

        function saveInput(key, value) {
            state.answers[key] = value;
            updateProgress();
            updateSidebarStatus();
        }

        function setActiveInput(id) {
            document.querySelectorAll('.active-target').forEach(el => el.classList.remove('active-target'));
            state.activeInputId = id;
            const el = document.getElementById(id);
            if (el) el.classList.add('active-target');
        }

        function fillFromWordBank(word, fieldIds) {
            playTone('click');
            let targetId = state.activeInputId;
            // If no active target or target not in current step's fieldIds, pick first empty
            if (!targetId || !fieldIds.includes(targetId)) {
                targetId = fieldIds.find(id => !state.answers[id] || state.answers[id].trim() === '') || fieldIds[0];
            }
            const el = document.getElementById(targetId);
            if (el) {
                el.value = word;
                el.classList.remove('correct', 'incorrect');
                saveInput(targetId, word);
                // Move focus to next empty field automatically
                const nextEmpty = fieldIds.find(id => !state.answers[id] || state.answers[id].trim() === '');
                if (nextEmpty) {
                    setActiveInput(nextEmpty);
                } else {
                    setActiveInput(targetId);
                }
            }
        }

        function renderWordBank(words, fieldIds) {
            const idsStr = JSON.stringify(fieldIds).replace(/"/g, "'");
            return `
                <div class="bg-sky-50/90 border-2 border-sky-200 rounded-2xl p-4 mb-5">
                    <div class="flex items-center gap-2 text-sky-800 font-bold text-sm sm:text-base mb-2.5">

                    </div>
                    <div class="flex flex-wrap gap-2.5">
                        ${words.map(w => `
                            <button type="button" onclick="fillFromWordBank('${w}', ${idsStr})"
                                class="word-chip px-4 py-2 rounded-xl bg-white border-2 border-sky-300 hover:border-leaf-500 hover:bg-leaf-50 text-slate-800 font-bold text-base sm:text-lg shadow-xs">
                                ${w}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderInput(id, placeholder = '................', widthClass = 'w-44 sm:w-52') {
            const val = (state.answers[id] || '').replace(/"/g, '&quot;');
            return `<input type="text" id="${id}" value="${val}" placeholder="${placeholder}"

        function showToast(msg, type = 'success') {
            const box = document.getElementById('toast-box');
            const inner = document.getElementById('toast-inner');
            const icon = document.getElementById('toast-icon');
            const text = document.getElementById('toast-msg');

            const styles = {
                success: { cls: 'bg-leaf-50 border-leaf-500 text-leaf-900', ic: '🎉' },
                warning: { cls: 'bg-amber-50 border-amber-500 text-amber-900', ic: '💡' },
                error:   { cls: 'bg-red-50 border-red-400 text-red-900', ic: '🧐' },
                info:    { cls: 'bg-sky-50 border-sky-400 text-sky-900', ic: 'ℹ️' }
            };
            const st = styles[type] || styles.info;
            inner.className = `rounded-2xl shadow-2xl px-5 py-4 font-bold text-base sm:text-lg flex items-center gap-3 border-2 ${st.cls}`;
            icon.textContent = st.ic;
            text.textContent = msg;

            box.classList.remove('translate-x-[120%]');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => {
                box.classList.add('translate-x-[120%]');
            }, 3200);
        }

        function openModal(title, body, onConfirm) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').textContent = body;
            const btn = document.getElementById('modal-confirm-btn');
            btn.onclick = () => { closeModal(); onConfirm(); };
            const modal = document.getElementById('custom-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

                            </div>

                            <!-- Full Review Card -->
                            <div class="bg-white rounded-3xl shadow-md border-2 border-slate-200 p-6 sm:p-8 space-y-5 scalable-text">
                                <h3 class="text-xl font-extrabold text-leaf-800 border-b-2 border-leaf-100 pb-2">Chi tiết bài làm của em</h3>
                                ${renderSummaryRow('Câu 1', `Quang hợp là quá trình <b>${valOrDash('c1_1')}</b> và <b>${valOrDash('c1_2')}</b>, diễn ra chủ yếu ở <b>${valOrDash('c1_3')}</b>, trong bào quan <b>${valOrDash('c1_4')}</b>.`)}
                                ${renderSummaryRow('Câu 2', `Nguyên liệu: <b>${valOrDash('c2_1')}</b> | Sản phẩm: <b>${valOrDash('c2_2')}</b> | Yếu tố tham gia: <b>${valOrDash('c2_3')}</b>`)}
                                ${renderSummaryRow('Câu 3', `Sử dụng <b>${valOrDash('c3_1')}</b> và khí <b>${valOrDash('c3_2')}</b> nhờ năng lượng <b>${valOrDash('c3_3')}</b> được <b>${valOrDash('c3_4')}</b> hấp thụ để tổng hợp <b>${valOrDash('c3_5')}</b> và giải phóng khí <b>${valOrDash('c3_6')}</b>.`)}
                                ${renderSummaryRow('Câu 4', `<b>${valOrDash('c4_l1')}</b> + <b>${valOrDash('c4_l2')}</b> ⟶ (<i>${valOrDash('c4_top')} / ${valOrDash('c4_bot')}</i>) ⟶ <b>${valOrDash('c4_r1')}</b> + <b>${valOrDash('c4_r2')}</b>`)}
                                ${renderSummaryRow('Câu 5', `Các phân tử <b>${valOrDash('c5_1')}</b> liên kết hình thành nên <b>${valOrDash('c5_2')}</b>.`)}
                                ${renderSummaryRow('Câu 6', `Lấy vào: <b>${valOrDash('c6_1')}</b> | Giải phóng: <b>${valOrDash('c6_2')}</b> | Tổng hợp: <b>${valOrDash('c6_3')}</b> | Hấp thụ: <b>${valOrDash('c6_4')}</b> | Tích trữ: <b>${valOrDash('c6_5')}</b>`)}
                                ${renderSummaryRow('Câu 7', `Diễn ra <b>${valOrDash('c7_1')}</b>; tổng hợp <b>${valOrDash('c7_2')}</b>; giải phóng <b>${valOrDash('c7_3')}</b>; chuyển hoá thành <b>${valOrDash('c7_4')}</b>.`)}
                                ${renderSummaryRow('Câu 8', `Cơ quan: <b>${valOrDash('c8_1')}</b>; Phiến lá: <b>${valOrDash('c8_2')}</b>, <b>${valOrDash('c8_3')}</b>; <b>${valOrDash('c8_4')}</b>; <b>${valOrDash('c8_5')}</b>; <b>${valOrDash('c8_6')}</b>; Diệp lục: <b>${valOrDash('c8_7')}</b> và <b>${valOrDash('c8_8')}</b>.`)}
                                ${renderSummaryRow('Câu 9', `Phiến lá: ${valOrDash('c9_1a')} (${valOrDash('c9_1b')}) • Lục lạp: ${valOrDash('c9_2a')} (${valOrDash('c9_2b')}) • Gân lá: ${valOrDash('c9_3a')} (${valOrDash('c9_3b')}) • Khí khổng: ${valOrDash('c9_4a')} (${valOrDash('c9_4b')})`)}
                                ${renderSummaryRow('Câu 10', valOrDash('c10'))}
                                ${renderSummaryRow('Câu 11', valOrDash('c11'))}
                                ${renderSummaryRow('Câu 12', valOrDash('c12'))}
                                ${renderSummaryRow('Câu 13', valOrDash('c13'))}
                            </div>
                        </div>
                    `;
                    break;
            }

            container.innerHTML = html;
            document.getElementById('main-scroll').scrollTop = 0;

            // Update bottom navigation buttons visibility
            document.getElementById('btn-prev').disabled = state.currentStep === 0;
            const isLast = state.currentStep === steps.length - 1;
            const isIntro = state.currentStep === 0;

            document.getElementById('btn-next').classList.toggle('hidden', isLast);
            document.getElementById('btn-next-label').textContent = isIntro ? 'Bắt đầu làm bài' : (state.currentStep === steps.length - 2 ? 'Xem tổng kết' : 'Tiếp theo');
            document.getElementById('btn-check').classList.toggle('hidden', !step.checkable);
            document.getElementById('btn-hint').classList.toggle('hidden', isIntro || isLast);

            renderSidebar();
            updateProgress();
        }

        function valOrDash(key) {
            const v = (state.answers[key] || '').trim();
            return v ? v.replace(/</g, '&lt;').replace(/>/g, '&gt;') : '<span class="text-slate-400 italic">(chưa điền)</span>';
        }

        function renderSummaryRow(title, content) {
            return `
                <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200">
                    <span class="inline-block px-2.5 py-0.5 rounded-lg bg-leaf-600 text-white font-bold text-sm mr-2">${title}</span>
                    <span class="text-slate-800">${content}</span>
                </div>
            `;
        }

        /* =====================================================================
           6. AUTO-CHECKING & HINTS
           ===================================================================== */
        function toggleHint() {
            playTone('click');
            const box = document.getElementById('hint-box');
            if (box) {
                box.classList.toggle('hidden');
                if (!box.classList.contains('hidden')) {
                    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
        }

        function checkCurrentStep() {
            const step = steps[state.currentStep];
            let fields = [];
            let keywordMode = false;

            if (step.id === 'nv1_c1') fields = ['c1_1', 'c1_2', 'c1_3', 'c1_4'];
            else if (step.id === 'nv1_c2') { fields = ['c2_1', 'c2_2', 'c2_3']; keywordMode = true; }
            else if (step.id === 'nv1_c3') fields = ['c3_1', 'c3_2', 'c3_3', 'c3_4', 'c3_5', 'c3_6'];
            else if (step.id === 'nv2_c4_5') fields = ['c4_l1', 'c4_l2', 'c4_top', 'c4_bot', 'c4_r1', 'c4_r2', 'c5_1', 'c5_2'];
            else if (step.id === 'nv3_c6') { fields = ['c6_1', 'c6_2', 'c6_3', 'c6_4', 'c6_5']; keywordMode = true; }
            else if (step.id === 'nv3_c7') fields = ['c7_1', 'c7_2', 'c7_3', 'c7_4'];
            else if (step.id === 'nv4_c8') fields = ['c8_1', 'c8_2', 'c8_3', 'c8_4', 'c8_5', 'c8_6', 'c8_7', 'c8_8'];
            else if (step.id === 'nv4_c9') {
                // Open table check: verify non-empty
                const tFields = ['c9_1a','c9_1b','c9_2a','c9_2b','c9_3a','c9_3b','c9_4a','c9_4b'];
                let filled = 0;
                tFields.forEach(id => {
                    const el = document.getElementById(id);
                    const ok = (state.answers[id] || '').trim().length >= 4;
                    if (el) {
                        el.classList.remove('correct', 'incorrect');
                        el.classList.add(ok ? 'correct' : 'incorrect');
                    }
                    if (ok) filled++;
                });
                if (filled === tFields.length) {
                    playTone('success');
                    showToast('Tuyệt vời! Em đã điền đầy đủ Bảng 22.2. Hãy bấm "Gợi ý / Đáp án" để đối chiếu nhé!', 'success');
                } else {
                    playTone('error');
                    showToast(`Em mới hoàn thành ${filled}/${tFields.length} ô. Hãy bổ sung các ô màu đỏ nhé!`, 'warning');
                }
                return;
            }

            let correctCount = 0;
            fields.forEach(id => {
                const el = document.getElementById(id);
                const val = state.answers[id] || '';
                const keys = answerKeys[id] || [];
                const isOk = keywordMode ? isKeywordMatch(val, keys) : isExactMatch(val, keys);
                if (el) {
                    el.classList.remove('correct', 'incorrect');
                    el.classList.add(isOk ? 'correct' : 'incorrect');
                }
                if (isOk) correctCount++;
            });

            if (correctCount === fields.length) {
                playTone('success');
                state.checkedSteps[step.id] = true;
                showToast(`Xuất sắc! Chính xác ${correctCount}/${fields.length} ý!`, 'success');
            } else {
                playTone('error');
                showToast(`Đúng ${correctCount}/${fields.length} ý. Hãy kiểm tra lại các ô màu đỏ nhé!`, 'error');
            }
            renderSidebar();
        }

        /* =====================================================================
           7. PROGRESS, NAVIGATION, SIDEBAR, FONT SIZE & FULLSCREEN
           ===================================================================== */
        function isQuestionCompleted(qNum) {
            const a = state.answers;
            const nonEmpty = (...keys) => keys.every(k => (a[k] || '').trim().length > 0);
            switch (qNum) {
                case 1: return nonEmpty('c1_1','c1_2','c1_3','c1_4');
                case 2: return nonEmpty('c2_1','c2_2','c2_3');
                case 3: return nonEmpty('c3_1','c3_2','c3_3','c3_4','c3_5','c3_6');
                case 4: return nonEmpty('c4_l1','c4_l2','c4_top','c4_bot','c4_r1','c4_r2');
                case 5: return nonEmpty('c5_1','c5_2');
                case 6: return nonEmpty('c6_1','c6_2','c6_3','c6_4','c6_5');
                case 7: return nonEmpty('c7_1','c7_2','c7_3','c7_4');
                case 8: return nonEmpty('c8_1','c8_2','c8_3','c8_4','c8_5','c8_6','c8_7','c8_8');
                case 9: return nonEmpty('c9_1a','c9_1b','c9_2a','c9_2b','c9_3a','c9_3b','c9_4a','c9_4b');
                case 10: return nonEmpty('c10');
                case 11: return nonEmpty('c11');
                case 12: return nonEmpty('c12');
                case 13: return nonEmpty('c13');
                default: return false;
            }
        }

        function countCompletedQuestions() {
            let c = 0;
            for (let i = 1; i <= 13; i++) if (isQuestionCompleted(i)) c++;
            return c;
        }

        function updateProgress() {
            const done = countCompletedQuestions();
            const pct = Math.round((done / 13) * 100);
            const bar = document.getElementById('progress-bar');
            const txt = document.getElementById('progress-text');
            if (bar) bar.style.width = pct + '%';
            if (txt) txt.textContent = `${done} / 13 câu (${pct}%)`;
        }

        function updateHeaderStudent() {
            const el = document.getElementById('header-student-info');
            if (state.studentName || state.studentClass) {
                el.textContent = `HS: ${state.studentName || '...'} • Lớp: ${state.studentClass || '...'}`;
            } else {
                el.textContent = 'Phiếu học tập chuẩn bị bài • KHTN 7';
            }
        }

        function renderSidebar() {
            const nav = document.getElementById('sidebar-nav');
            let lastSection = '';
            let html = '';

            steps.forEach((st, idx) => {
                if (st.section !== lastSection) {
                    html += `<div class="pt-3 pb-1 px-2 text-xs font-extrabold uppercase tracking-wider text-leaf-700">${st.section}</div>`;
                    lastSection = st.section;
                }
                const isActive = idx === state.currentStep;
                const isDone = st.questions.length > 0 && st.questions.every(q => isQuestionCompleted(q));
                html += `
                    <button onclick="goToStep(${idx})" class="w-full text-left px-3.5 py-2.5 rounded-xl font-semibold text-sm sm:text-base transition flex items-center justify-between gap-2 ${
                        isActive
                            ? 'bg-leaf-600 text-white shadow-md'
                            : 'text-slate-700 hover:bg-leaf-50'
                    }">
                        <span class="truncate">${st.short}</span>
                        <span class="shrink-0 text-sm">
                            ${isDone ? (isActive ? '✅' : '🟢') : (st.questions.length ? '⚪' : '')}
                        </span>
                    </button>
                `;
            });
            nav.innerHTML = html;
        }

        function updateSidebarStatus() {
            renderSidebar();
        }

        function goToStep(index) {
            if (index < 0 || index >= steps.length) return;
            playTone('click');
            state.currentStep = index;
            renderStep();
            // Auto-close sidebar on mobile after selection
            if (window.innerWidth < 1024) {
                closeSidebarMobile();
            }
        }

        function nextStep() {
            if (state.currentStep < steps.length - 1) goToStep(state.currentStep + 1);
        }

        function prevStep() {
            if (state.currentStep > 0) goToStep(state.currentStep - 1);
        }

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const bd = document.getElementById('sidebar-backdrop');
            if (window.innerWidth < 1024) {
                const isClosed = sb.classList.contains('-translate-x-full');
                sb.classList.toggle('-translate-x-full', !isClosed);
                bd.classList.toggle('hidden', !isClosed);
            } else {
                sb.classList.toggle('hidden');
            }
        }

        function closeSidebarMobile() {
            document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('sidebar-backdrop').classList.add('hidden');
        }

        function changeFontSize(delta) {
            playTone('click');
            state.fontSizeScale = Math.min(1.5, Math.max(0.8, +(state.fontSizeScale + delta).toFixed(1)));
            document.documentElement.style.setProperty('--content-scale', state.fontSizeScale);
            const label = document.getElementById('font-size-label');
            if (label) label.textContent = Math.round(state.fontSizeScale * 100) + '%';
        }

        function toggleFullscreen() {
            playTone('click');
            try {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {
                        showToast('Trình duyệt đang chặn chế độ toàn màn hình.', 'info');
                    });
                } else {
                    document.exitFullscreen();
                }
            } catch (e) {
                showToast('Thiết bị không hỗ trợ nút toàn màn hình.', 'info');
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const isFs = !!document.fullscreenElement;
            document.getElementById('icon-fs-enter').classList.toggle('hidden', isFs);
            document.getElementById('icon-fs-exit').classList.toggle('hidden', !isFs);
        });

        function confirmReset() {
            openModal('Làm lại Phiếu học tập?', 'Toàn bộ câu trả lời hiện tại sẽ được xóa để em làm lại từ đầu.', () => {
                Object.keys(state.answers).forEach(k => state.answers[k] = '');
                state.checkedSteps = {};
                goToStep(0);
                showToast('Đã làm mới phiếu học tập!', 'info');
            });
        }

        /* =====================================================================
           8. INITIALIZATION
           ===================================================================== */
        window.onload = function () {
            renderStep();
        };
    </script>
</body>
</html>
